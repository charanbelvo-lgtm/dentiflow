<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · DentiFlow</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="auth">
    <section class="auth-art">
      <div class="auth-tooth">✦</div>
      <h2>Care that flows.</h2>
      <p>Appointments, clinical notes, treatment plans, inventory, and revenue in one vibrant workspace.</p>
      <div class="quick-links">
        <span class="pill">Role-Based Workspaces</span>
        <span class="pill">Local Demo Data</span>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="eyebrow">WELCOME BACK</div>
        <h1>DentiFlow</h1>
        <p class="muted">Choose a demo role or enter your details to sign in.</p>

        <form data-login>
          <div class="role-choice" style="grid-template-columns:repeat(3,1fr);">
            <label>
              <input type="radio" name="role" value="doctor" checked> <b>Doctor</b>
              <small class="muted"><br>Clinical & visits</small>
            </label>
            <label>
              <input type="radio" name="role" value="patient"> <b>Patient</b>
              <small class="muted"><br>Book & wait time</small>
            </label>
            <label>
              <input type="radio" name="role" value="admin"> <b>Admin</b>
              <small class="muted"><br>Inventory & profits</small>
            </label>
          </div>

          <div class="field">
            <label>Your name</label>
            <input type="text" name="name" placeholder="Ashwini Goud, Dr. Alex, or Dr. Rajesh" autocomplete="name">
          </div>
          <div class="field" style="margin-top:14px">
            <label>Email address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="field" style="margin-top:14px">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px">Sign in →</button>
        </form>

        <p class="muted" style="text-align:center;margin:18px 0 10px">or quick demo login</p>
        <div class="grid grid-4" style="grid-template-columns:repeat(4,1fr);gap:8px;">
          <button class="btn btn-soft" data-demo-role="doctor" style="justify-content:center;padding:8px 4px;">Doctor</button>
          <button class="btn btn-soft" data-demo-role="patient" style="justify-content:center;padding:8px 4px;">Patient</button>
          <button class="btn btn-soft" data-demo-role="admin" style="justify-content:center;padding:8px 4px;">Admin</button>
          <button class="btn btn-soft" data-demo-role="reception" style="justify-content:center;padding:8px 4px;">Reception</button>
        </div>

        <p class="muted" style="font-size:12px;text-align:center;margin-top:20px">
          <a href="./index.html">← Back to landing</a>
        </p>
      </div>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
