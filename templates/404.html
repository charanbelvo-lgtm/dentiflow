{% extends "base.html" %}
{% block title %}Page not found - DentiFlow{% endblock %}
{% block public_content %}
<main class="public-page text-center" style="padding:12vh 24px;">
	<div class="display-1 text-primary mb-3"><i class="fa-solid fa-tooth" aria-hidden="true"></i></div>
	<h1>Oops! This page wandered out of the clinic.</h1>
	<p class="text-muted mb-4">The address may be outdated or the page may have moved.</p>
	<a class="btn btn-df-primary me-2" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">Back to Dashboard</a>
	<a class="btn btn-df-secondary" href="{{ url_for('dashboard.landing_or_dashboard') }}">Go Home</a>
</main>
{% endblock %}
